# Wealth Workbench — local / shared demo stack
#
# Infra only (host runs API + Next via ./start.sh):
#   docker compose up -d postgres redis
#
# Full stack in Docker:
#   docker compose --profile full up -d --build
#
# Optional Neo4j (wealth graph):
#   docker compose --profile neo4j up -d neo4j
#   # or with full: docker compose --profile full --profile neo4j up -d --build

services:
  postgres:
    image: timescale/timescaledb:2.28.3-pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-rm_workbench}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/init-test-db.sql:/docker-entrypoint-initdb.d/02-init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rm_user} -d ${POSTGRES_DB:-rm_workbench}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  neo4j:
    profiles: ["neo4j"]
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      # Host 7688 matches default NEO4J_URI in Settings / .env.example
      - "7474:7474"
      - "7688:7687"
    volumes:
      - neo4j_data:/data

  backend:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # In-compose networking overrides localhost URLs from .env
      DATABASE_URL: postgresql://${POSTGRES_USER:-rm_user}:${POSTGRES_PASSWORD:-demo_password_123}@postgres:5432/${POSTGRES_DB:-rm_workbench}
      REDIS_URL: redis://redis:6379
      AUTH_MODE: ${AUTH_MODE:-fixture}
      APP_ENV: ${APP_ENV:-development}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      EXPECTED_SCHEMA_HEAD: ${EXPECTED_SCHEMA_HEAD:-j0urn3y0001}
      NEO4J_ENABLED: ${NEO4J_ENABLED:-false}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
        NEXT_PUBLIC_BOOK_ID: ${NEXT_PUBLIC_BOOK_ID:-FIXTURE_BOOK_001}
        NEXT_PUBLIC_TENANT_ID: ${NEXT_PUBLIC_TENANT_ID:-FIXTURE_TENANT_001}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
