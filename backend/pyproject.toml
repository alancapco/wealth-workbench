[project]
name = "rm-workbench-backend"
version = "0.1.0"
description = "RM Workbench MVP Backend"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "redis>=5.0.1",
    "pgvector>=0.2.4",
    "hubspot-api-client>=13.0.0",
    "openai>=1.10.0",
    "requests>=2.31.0",
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "greenlet>=3.0.0",
    "mako>=1.3.0",
    "tigeropen>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
]
