services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: workbench_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: workbench_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "workbench_test"]
      interval: 5s
      timeout: 3s
      retries: 5
